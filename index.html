<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goodreads 3D Reading Stack</title>
  <style>
    /* Widget container styles */
    .bookshelf-widget {
      position: relative;
      width: 100%;
      max-width: 960px;
      height: 580px;
      margin: 2rem auto;
      border-radius: 16px;
      overflow: hidden;
      background: radial-gradient(circle at center, #1e2530 0%, #0d1117 100%);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* WebGL Canvas fills the container */
    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      cursor: grab;
    }
    #webgl-canvas:active {
      cursor: grabbing;
    }

    /* UI Overlays */
    .widget-header {
      position: absolute;
      top: 1.25rem;
      left: 1.5rem;
      pointer-events: none;
      color: #fff;
    }
    .widget-header h3 {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .widget-header p {
      margin: 0.25rem 0 0;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.55);
    }

    .shelf-labels {
      position: absolute;
      bottom: 1.25rem;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      pointer-events: none;
      padding: 0 4rem;
    }
    .shelf-pill {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    /* Fullscreen Toggle Button */
    .fullscreen-btn {
      position: absolute;
      top: 1.25rem;
      right: 1.5rem;
      z-index: 10;
      width: 36px;
      height: 36px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: rgba(255, 255, 255, 0.85);
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease, color 0.2s ease;
    }

    .fullscreen-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      transform: scale(1.05);
    }

    .fullscreen-btn:active {
      transform: scale(0.95);
    }

    /* Container rules when fullscreen is active */
    .bookshelf-widget:fullscreen {
      max-width: 100vw;
      width: 100vw;
      height: 100vh;
      margin: 0;
      border-radius: 0;
      border: none;
    }

    /* Safari / WebKit vendor pseudo-class */
    .bookshelf-widget:-webkit-full-screen {
      max-width: 100vw;
      width: 100vw;
      height: 100vh;
      margin: 0;
      border-radius: 0;
      border: none;
    }

    /* Modal Overlay */
    .shelf-modal-overlay {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(13, 16, 23, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .shelf-modal-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .modal-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 380px;
      padding: 2rem;
      color: #f0f4f8;
    }

    /* Book Dropping Stage */
    .book-drop-stage {
      position: relative;
      width: 140px;
      height: 150px;
      margin-bottom: 1.5rem;
    }

    .drop-book {
      position: absolute;
      left: 20px;
      width: 100px;
      height: 14px;
      border-radius: 2px 4px 4px 2px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transform-origin: center center;
    }

    /* Page trim line highlight */
    .drop-book span {
      position: absolute;
      top: 3px;
      right: 4px;
      width: 86px;
      height: 8px;
      background: rgba(255, 250, 235, 0.2);
      border-radius: 1px;
    }

    /* Book Silhouette Palettes */
    #dbook-0 { background: #3a475a; }
    #dbook-1 { background: #8a3b34; }
    #dbook-2 { background: #2f564e; }
    #dbook-3 { background: #82632b; }
    #dbook-4 { background: #5a3c68; }
    #dbook-5 { background: #2c3848; }

    .drop-pedestal {
      position: absolute;
      bottom: 8px;
      left: 10px;
      width: 120px;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }

    .modal-status-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.75);
      letter-spacing: 0.02em;
    }

    /* Error State */
    .burning-book-icon {
      margin-bottom: 1rem;
      filter: drop-shadow(0 0 16px rgba(255, 87, 34, 0.35));
    }

    .error-title {
      margin: 0 0 0.5rem 0;
      font-size: 1.25rem;
      font-weight: 600;
      color: #ff6b6b;
    }

    .error-message {
      margin: 0 0 1.5rem 0;
      font-size: 0.85rem;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.65);
      word-break: break-word;
      background: rgba(0, 0, 0, 0.35);
      padding: 0.6rem 0.9rem;
      border-radius: 6px;
      border: 1px solid rgba(255, 107, 107, 0.2);
      font-family: "SFMono-Regular", Consolas, Menlo, monospace;
    }

    .modal-retry-btn {
      padding: 0.6rem 1.4rem;
      font-size: 0.85rem;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .modal-retry-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-1px);
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "gsap": "https://unpkg.com/gsap@3.12.5/index.js"
      }
    }
  </script>
</head>
<body>

  <div class="bookshelf-widget" id="bookshelf-container">
    <div class="widget-header">
      <h3>Library Shelf</h3>
      <p>Click any book to inspect • Click again to flip</p>
    </div>

    <div id="shelf-modal-overlay" class="shelf-modal-overlay">
      <!-- 1. Loading View -->
      <div id="modal-loading-view" class="modal-content">
        <div class="book-drop-stage">
          <div class="drop-book" id="dbook-0"><span></span></div>
          <div class="drop-book" id="dbook-1"><span></span></div>
          <div class="drop-book" id="dbook-2"><span></span></div>
          <div class="drop-book" id="dbook-3"><span></span></div>
          <div class="drop-book" id="dbook-4"><span></span></div>
          <div class="drop-book" id="dbook-5"><span></span></div>
          <div class="drop-pedestal"></div>
        </div>
        <p class="modal-status-text">Fetching your Goodreads shelves…</p>
      </div>

      <!-- 2. Error View -->
      <div id="modal-error-view" class="modal-content" style="display: none;">
        <div class="burning-book-icon">
          <svg viewBox="0 0 100 100" width="84" height="84" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Flames -->
            <path d="M50 8C50 8 36 24 43 38C38 31 32 28 32 28C32 28 26 40 33 50C25 43 23 37 23 37C18 47 22 59 29 65C30 58 35 55 35 55C35 55 36 67 48 70C57 68 64 61 65 52C65 44 60 38 55 34C55 34 62 31 63 21C58 26 53 28 50 8Z" fill="#ff5722" opacity="0.95"/>
            <path d="M50 20C50 20 40 32 45 42C41 37 38 35 38 35C38 35 34 43 39 50C33 46 32 42 32 42C29 49 32 57 37 61C37 56 41 54 41 54C41 54 43 62 50 63C56 62 60 57 60 50C60 44 57 40 53 37C53 37 58 35 58 28C55 31 52 33 50 20Z" fill="#ffb300"/>
            <!-- Book Silhouette -->
            <path d="M18 72L48 66V88L18 94V72Z" fill="#2c3240" stroke="#161922" stroke-width="2"/>
            <path d="M82 72L52 66V88L82 94V72Z" fill="#3a4253" stroke="#161922" stroke-width="2"/>
            <!-- Page Trim Lines -->
            <path d="M48 68L22 74M48 73L22 79M48 78L22 84" stroke="#fffae6" stroke-width="1.2" opacity="0.4"/>
            <path d="M52 68L78 74M52 73L78 79M52 78L78 84" stroke="#fffae6" stroke-width="1.2" opacity="0.4"/>
            <!-- Spine Ridge -->
            <path d="M48 66L50 65L52 66V88L50 89L48 88V66Z" fill="#12151b"/>
            <!-- Rising Ember Sparks -->
            <circle cx="34" cy="18" r="1.5" fill="#ffb300" opacity="0.8"/>
            <circle cx="62" cy="14" r="2" fill="#ff5722" opacity="0.7"/>
            <circle cx="48" cy="4" r="1.2" fill="#ffe082"/>
          </svg>
        </div>
        <h4 class="error-title">Shelf Load Failed</h4>
        <p id="modal-error-message" class="error-message">Unable to connect to Goodreads RSS feed.</p>
        <button id="modal-retry-btn" class="modal-retry-btn">Retry Connection</button>
      </div>

    </div>
    
    <!-- Fullscreen Toggle Button -->
    <button id="fullscreen-btn" class="fullscreen-btn" aria-label="Toggle Fullscreen" title="Toggle Fullscreen">
      <!-- Expand Icon -->
      <svg class="icon-expand" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
      </svg>
      <!-- Compress Icon -->
      <svg class="icon-compress" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
        <path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/>
      </svg>
    </button>

    <canvas id="webgl-canvas"></canvas>

    <div class="shelf-labels">
      <div class="shelf-pill">To Be Read</div>
      <div class="shelf-pill">Currently Reading</div>
      <div class="shelf-pill">Recently Read</div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
