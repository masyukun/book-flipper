<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goodreads 3D Reading Stack</title>
  <style>
    /* Widget container styles */
    .bookshelf-widget {
      position: relative;
      width: 100%;
      max-width: 960px;
      height: 580px;
      margin: 2rem auto;
      border-radius: 16px;
      overflow: hidden;
      background: radial-gradient(circle at center, #1e2530 0%, #0d1117 100%);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* WebGL Canvas fills the container */
    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      cursor: grab;
    }
    #webgl-canvas:active {
      cursor: grabbing;
    }

    /* UI Overlays */
    .widget-header {
      position: absolute;
      top: 1.25rem;
      left: 1.5rem;
      pointer-events: none;
      color: #fff;
    }
    .widget-header h3 {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .widget-header p {
      margin: 0.25rem 0 0;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.55);
    }

    .shelf-labels {
      position: absolute;
      bottom: 1.25rem;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      pointer-events: none;
      padding: 0 4rem;
    }
    .shelf-pill {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    /* Fullscreen Toggle Button */
    .fullscreen-btn {
      position: absolute;
      top: 1.25rem;
      right: 1.5rem;
      z-index: 10;
      width: 36px;
      height: 36px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: rgba(255, 255, 255, 0.85);
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease, color 0.2s ease;
    }

    .fullscreen-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      transform: scale(1.05);
    }

    .fullscreen-btn:active {
      transform: scale(0.95);
    }

    /* Container rules when fullscreen is active */
    .bookshelf-widget:fullscreen {
      max-width: 100vw;
      width: 100vw;
      height: 100vh;
      margin: 0;
      border-radius: 0;
      border: none;
    }

    /* Safari / WebKit vendor pseudo-class */
    .bookshelf-widget:-webkit-full-screen {
      max-width: 100vw;
      width: 100vw;
      height: 100vh;
      margin: 0;
      border-radius: 0;
      border: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "gsap": "https://unpkg.com/gsap@3.12.5/index.js"
      }
    }
  </script>
</head>
<body>

  <div class="bookshelf-widget" id="bookshelf-container">
    <div class="widget-header">
      <h3>Library Shelf</h3>
      <p>Click any book to inspect • Click again to flip</p>
    </div>

    <!-- Fullscreen Toggle Button -->
    <button id="fullscreen-btn" class="fullscreen-btn" aria-label="Toggle Fullscreen" title="Toggle Fullscreen">
      <!-- Expand Icon -->
      <svg class="icon-expand" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
      </svg>
      <!-- Compress Icon -->
      <svg class="icon-compress" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
        <path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/>
      </svg>
    </button>

    <canvas id="webgl-canvas"></canvas>

    <div class="shelf-labels">
      <div class="shelf-pill">To Be Read</div>
      <div class="shelf-pill">Currently Reading</div>
      <div class="shelf-pill">Recently Read</div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
